# CI (M52b) — ローカルの検証 bat を **そのまま** 呼ぶ単一 job。
#
# 方針: CI 専用の検証ロジックは書かない (二重メンテを作らない)。
# CI 固有の事情は環境変数 4 種だけで注入し、bat 本体はローカルと 1 文字も変えない
# (4 つ目の MYE_SHOT_SKIP_* は同じ役目の 6 本 = FXAA / TAA / SSR / FROXEL / FOG / PARTICLE):
#   MYE_EXTRA_ARGS   … 全 Editor.exe 実行へ後置する引数
#                      --warp    = GPU の無い runner でも D3D11 デバイスを作る (WARP)
#                      --no-audio = 音声デバイスが無いので XAudio2 を初期化しない
#   MYE_MSBUILD_ARGS … MSBuild へ後置 (警告 0 の機械化)。
#                      /p:MyeWarnAsError=true は Common.props の**既定 off** の
#                      オプトイン (ローカル開発は警告 1 個で止まらない)。
#                      ★ /p:TreatWarningAsError=true は効かない — C++ ではこれは
#                        ClCompile の項目メタデータで、グローバルプロパティは
#                        誰にも読まれず静かに素通りする (M52b で実測)
#   MYE_DOTNET_ARGS  … dotnet build へ後置 (C# は綴りが TreatWarningsAsErrors)
#   MYE_SHOT_SKIP_FXAA … スクショ 10 枚目 (FXAA を通す 1 枚) を飛ばす。
#                      WARP 同士でも **OS ビルドが違うと** FXAA の出力はビット一致しない
#                      (開発機 10.0.26100 / ランナー 10.0.20348 の d3d10warp・d3dcompiler)。
#                      素の描画の機種差は最大 1 レベルなのに、FXAA の輝度しきい値分岐が
#                      それを 35 レベルへ増幅する — 実測は shot_verify.bat の冒頭に表がある。
#                      CI が判定する 10 枚は --no-fxaa 撮影なので tol=3 の厳格判定のまま回せる
#   MYE_SHOT_SKIP_TAA … スクショ 11 枚目 (TAA を通す 1 枚、M55d) を飛ばす。
#                      TAA の近傍 min/max クランプは FXAA と同型のしきい値分岐で、しかも
#                      履歴でフレーム間に蓄積する = 同じ増幅が起きうる。増幅率を実測する
#                      までは CI に載せない (載せると「理由不明で赤い」1 枚が増えるだけ)
#   MYE_SHOT_SKIP_SSR … スクショ 9 枚目 (SSR を通す 1 枚、M56d) を飛ばす。
#                      **当初は CI 判定 (tol=3) に載せていたが実測で降格した** (run 32622063559)。
#                      SSR の交差判定はレイの hit/miss で離散的に分岐するので、1 ULP の深度差が
#                      反転すると画素が反射色 ⇔ IBL フォールバックへ丸ごと飛ぶ:
#                      実測 maxDiff=95 だが tol 超えはわずか 30 画素 (FXAA の 1→35 と同型)。
#                      tol を上げると本物の SSR 回帰も同じ形なので一緒に見逃す。
#   MYE_SHOT_SKIP_FROXEL … スクショ 12 枚目 (フロクセルを通す 1 枚、M57d) を飛ばす。
#                      テンポラル蓄積を含む = TAA と同じ「フレーム間に蓄積するしきい値
#                      分岐」の系統で、さらに WARP の注入が実シーンで 60ms/フレーム
#                      掛かる (M57b 実測)。増幅率を測るまで CI に載せない
#   MYE_SHOT_SKIP_FOG … スクショ 15 枚目 (霧のショーケース、M57追補) を飛ばす。
#                      froxel を通すうえに **GPU パーティクルの sim 自体が WARP 上の
#                      float 演算**なので、粒子位置が WARP のバージョンで動きうる
#                      (CPU バックエンドと違い sim が GPU に載っている 1 枚)
#   MYE_SHOT_SKIP_PARTICLE … スクショ 16/17 枚目 (パーティクル 2 経路、M63a) を飛ばす。
#                      GPU 側は sim そのものが WARP 上の float 演算なので粒子位置が
#                      WARP のバージョンで動きうる (FOG と同じ理由)。CPU 側も対で外す —
#                      片方だけ CI に載せると「2 枚を突き合わせる」存在理由が崩れる。
#                      ★M63a が shot_verify.bat に囲いを作りながら**ここへの登録を
#                        忘れていた** (M65e で発見・追加)。CI は M63 以降まだ一度も
#                        回っていないので実害は出ていない
#
# ★MYE_SHOT_SKIP_ACOUSTIC (スクショ 18/19 枚目、M65e) は**わざと立てていない**。
#   波面は整数チャンファ距離 = 機種非依存、残光の符号化は sqrt (IEEE-754 で正しく
#   丸められる)、合成は lerp と乗算だけで**しきい値分岐もテンポラル蓄積も無い** —
#   上の 6 本を降格させた「1 ULP が増幅する」機構がどこにも無いので tol=3 で判定できる。
#   ランナーで赤くなったら **tol を上げずに** ここへ 1 行足すこと (囲いは bat 側にある)。
#
# sim は CPU 専用なのでリプレイのワールドハッシュは WARP でも実 GPU でも同一 —
# GPU 無し runner で replay_verify を回せる根拠がここ (計画の決定台帳 4)。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一 ref の古い run は捨てる (windows runner は分単価が高い)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: build x8 + selftest + replay determinism + screenshots
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      MYE_EXTRA_ARGS: --warp --no-audio
      MYE_MSBUILD_ARGS: /p:MyeWarnAsError=true
      MYE_DOTNET_ARGS: /p:TreatWarningsAsErrors=true
      MYE_SHOT_SKIP_FXAA: 1
      MYE_SHOT_SKIP_TAA: 1
      MYE_SHOT_SKIP_FROXEL: 1
      MYE_SHOT_SKIP_SSR: 1
      MYE_SHOT_SKIP_FOG: 1
      MYE_SHOT_SKIP_PARTICLE: 1
      MYE_COLLAB_REQUIRED: 1
    steps:
      - uses: actions/checkout@v4

      # ① マネージドスクリプトホスト (CoreCLR + Roslyn)。ネイティブ exe と同じ
      #    bin\x64\<Config>\ へ出る。両構成とも起動時にロードされるので両方作る
      - name: managed host (Debug)
        shell: cmd
        run: tools\build_managed.bat Debug

      - name: managed host (Release)
        shell: cmd
        run: tools\build_managed.bat Release

      # ①b Source control のサービス (Rust cdylib MyeCollab.dll + CLI、M66a)。
      #    replay の**前**に置くのは、この後の selftest が MYE_COLLAB_REQUIRED=1 で
      #    「DLL が無ければ失敗」を要求するため (作り忘れを SKIP で素通りさせない)。
      #    collab_verify.bat はエディタも D3D も使わない = ここで完結する
      - name: rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: collab service (cargo test + dll/cli build + fixture verify)
        shell: cmd
        run: cargo test --manifest-path tools\collab\Cargo.toml && tools\build_collab.bat Release && tools\collab_verify.bat

      # ② ローカルで打つのと同じ 1 行。この中で
      #    8 ビルド (4 プロジェクト x Debug/Release) → 7 ペアのリプレイ照合
      #    (既定デモ / 部位ショーケース / ゲームフロー / ローカル 2P / 物理 / 関節 / 音響)
      #    → snapshot 往復 → タイムトラベル巻き戻し → check_rules.ps1 まで回る。
      #    照合が割れたときは bat 自身がフィールド単位の差分を出す (M52a)
      - name: replay determinism (build x8 + 7 scene pairs + rule check)
        shell: cmd
        run: tools\replay_verify.bat

      # ③ ヘッドレス回帰テスト (D3D もウィンドウも作らない)
      - name: selftest (Debug)
        shell: cmd
        run: bin\x64\Debug\Editor.exe --selftest %MYE_EXTRA_ARGS%

      - name: selftest (Release)
        shell: cmd
        run: bin\x64\Release\Editor.exe --selftest %MYE_EXTRA_ARGS%

      # ④ 決定的スクリーンショットの回帰 (M52c)。tests\golden\*.png と
      #    撮り直しをピクセル比較する。撮影は Runtime.exe (imgui なし) で
      #    --warp --font-embedded --no-fxaa 固定 = ラスタライザ・フォント・
      #    機種差を増幅する 1 パスを開発機と揃える。
      #    replay_verify が先に Release をビルドしている前提 (bat はビルドしない)
      - name: screenshot regression (12 shots, no-fxaa/taa/ssr/froxel/fog/particle)
        shell: cmd
        run: tools\shot_verify.bat

      # ⑤ 配布パッケージのスモーク。GUI の「ビルドを作成」と同一パイプラインを
      #    CLI で回す (M51j)。成否は終了コードに載る (M52b)
      - name: package smoke (Release)
        shell: cmd
        run: bin\x64\Release\Editor.exe --package cache\dist_ci %MYE_EXTRA_ARGS%

      - name: package contents
        shell: pwsh
        run: |
          $need = @('Runtime.exe', 'GameLogic.dll', 'assets\shaders', 'assets\scenes')
          $missing = $need | Where-Object { -not (Test-Path "cache\dist_ci\$_") }
          if ($missing) { throw "package is missing: $($missing -join ', ')" }
          # M66a: 配布物に開発用の道具とリポジトリを混ぜない。--package は明示コピーなので
          # 現状は素通りするが、コピー規則を足したときに黙って入り込むのを止める
          $forbidden = @('MyeCollab.dll', 'MyeCollabCli.exe', '.git')
          $leaked = $forbidden | Where-Object { Test-Path "cache\dist_ci\$_" }
          if ($leaked) { throw "package must not contain: $($leaked -join ', ')" }
          '[package] ' + ((Get-ChildItem -Recurse -File cache\dist_ci | Measure-Object -Property Length -Sum).Sum / 1MB).ToString('0.0') + ' MB'

      # 失敗したときだけ .rep とダンプを持ち帰る (ローカルで --hash-diff にかけられる)
      - name: failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mye-ci-failure
          path: |
            cache/*.rep
            cache/*.dump
            cache/*.mismatch.txt
            cache/*.scene.json
            cache/*.log
            tests/actual/*.png
            bin/x64/*/crash/**
          if-no-files-found: ignore
          retention-days: 7
